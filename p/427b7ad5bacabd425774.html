<title>BFM</title>
<style>:root{color-scheme:light dark;--bg:#fbfbfa;--fg:#1a1a19;--mut:#6b6b68;
--line:#dedddA;--card:#ffffff;--acc:#1c3f6e}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e8e6;
--mut:#9a9a96;--line:#2b2f36;--card:#1b1e23;--acc:#8fb3e0}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,
sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:23rem;background:var(--card);border:1px solid
var(--line);border-radius:12px;padding:28px 26px 24px}
h1{margin:0 0 2px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
color:var(--acc)}
p{margin:0 0 16px;font-size:14px;color:var(--mut);min-height:2.6em}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px}
input{width:100%;padding:10px 12px;font-size:17px;letter-spacing:.18em;
border:1px solid var(--line);border-radius:8px;background:var(--bg);
color:var(--fg)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:12px;width:100%;padding:10px 12px;font-size:14px;
font-weight:600;border:0;border-radius:8px;background:var(--acc);color:#fff;
cursor:pointer}
button[disabled]{opacity:.55;cursor:default}
</style>

<script>(function(){"use strict";
var SKEY="bfm-dash-pw";
var P=JSON.parse(document.getElementById("bfm-payload").textContent);
var form=document.getElementById("bfm-form");
var input=document.getElementById("bfm-pw");
var msg=document.getElementById("bfm-msg");
var btn=document.getElementById("bfm-go");
var IDLE="This page is encrypted. Enter the passphrase to read it.";
function bytes(s){var r=atob(s),a=new Uint8Array(r.length),i;
for(i=0;i<r.length;i++){a[i]=r.charCodeAt(i);}return a;}
function unlock(pw){
var enc=new TextEncoder();
return crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,
["deriveKey"]).then(function(base){
return crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(P.salt),
iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,
["decrypt"]);}).then(function(key){
return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(P.iv)},key,bytes(P.ct));
}).then(function(buf){return new TextDecoder("utf-8").decode(buf);});}
function paint(html){document.open();document.write(html);document.close();}
function attempt(pw,quiet){
msg.textContent="Decrypting\u2026";if(btn){btn.disabled=true;}
unlock(pw).then(function(html){
try{sessionStorage.setItem(SKEY,pw);}catch(e){}
paint(html);}).catch(function(){
try{sessionStorage.removeItem(SKEY);}catch(e){}
if(btn){btn.disabled=false;}
msg.textContent=quiet?IDLE:"That passphrase did not work. Try again.";
if(input){input.value="";try{input.focus();}catch(e){}}});}
if(!window.crypto||!crypto.subtle){
msg.textContent="This browser cannot decrypt the page. Open it over HTTPS in "+
"a current browser.";return;}
form.addEventListener("submit",function(e){e.preventDefault();
attempt(input.value,false);});
var saved=null;try{saved=sessionStorage.getItem(SKEY);}catch(e){}
if(saved){attempt(saved,true);}else if(input){try{input.focus();}catch(e){}}
})();
</script>
